<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="radial-ambient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.12;0.25" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-accent" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatUpSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatDownSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseRing {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.2; }
      100% { transform: scale(1); opacity: 0.6; }
    }
    .floating-card-1 {
      animation: floatUpSlow 8s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatDownSlow 7s ease-in-out infinite;
    }
    .pulse-glow {
      transform-origin: center;
      animation: pulseRing 5s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="16" fill="url(#radial-ambient)"/>
  <rect width="1200" height="420" rx="16" fill="url(#radial-accent)"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Background Animated Cyber Elements (Behind Text) -->
  <g class="pulse-glow" opacity="0.4">
    <circle cx="980" cy="180" r="160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="980" cy="180" r="110" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="980" cy="180" r="60" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Animated Floating Metric Pill 1 (Right-Top) -->
  <g class="floating-card-1" transform="translate(860, 55)">
    <rect width="260" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="28" cy="32" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M 23 32 L 27 36 L 34 27" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">UNDERWRITING STATUS</text>
    <text x="50" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Agent E&amp;O Bound • 99.8%</text>
  </g>

  <!-- Animated Floating Metric Pill 2 (Right-Bottom) -->
  <g class="floating-card-2" transform="translate(880, 290)">
    <rect width="250" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="28" cy="32" r="12" fill="#a855f7" fill-opacity="0.2"/>
    <text x="23" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c084fc">⚡</text>
    <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">RISK QUANTIFICATION</text>
    <text x="50" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">FAIR &amp; Drift Guard Active</text>
  </g>

  <!-- Foreground Content (Guaranteed crisp and in front) -->
  <g transform="translate(70, 75)">
    <!-- Category Super-Header Tag -->
    <g transform="translate(0, 0)">
      <rect width="255" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        AI Agent Professional Liability
      </text>
      <text y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#primary-glow)" letter-spacing="-0.5">
        Insurance Tools &amp; Frameworks
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 168)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
        Comprehensive guide to SaaS Insurtech carriers, actuarial risk models,
      </text>
      <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
        model drift indemnities &amp; open-source agent governance runtime defenses.
      </text>
    </g>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 232)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🛡️ Actuarial CRQ</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(180, 0)">
        <rect width="186" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🤖 Agent E&amp;O Policies</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(378, 0)">
        <rect width="210" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">⚖️ EU AI Act &amp; NIST RMF</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(600, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🌟 100% Curated</text>
      </g>
    </g>
  </g>
</svg>
